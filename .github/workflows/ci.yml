name: CI

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ unit
  unit-tests:
    name: Unit tests (no Blender)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q --ignore=tests/blender
      - name: Self test of the installed program
        run: python -m blenderbridge.app --selftest
      - name: Build the Blender add-on zip
        run: python tools/build_addon_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: blenderbridge-addon
          path: dist/blenderbridge_addon.zip
          if-no-files-found: error

  # ------------------------------------------------------- real Blender (bpy)
  blender-tests:
    name: Blender 4.2 integration tests
    # Pinned: the bpy 4.2 wheels bundle their own libraries and need a glibc
    # that matches; newer runner images crashed with a segfault on import.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"     # bpy wheels exist for CPython 3.11
      - name: Install Blender's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxrender1 libxi6 libxkbcommon0 libxfixes3 libxxf86vm1 \
            libgl1 libglx0 libegl1 libsm6 libice6 libxrandr2 libxinerama1 libxcursor1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "bpy==4.2.0"
      - name: Check that Blender imports
        run: |
          python -c "import bpy; print('Blender', bpy.app.version_string)"
      - name: Run Blender integration tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/blender -q -rs --tb=short 2>&1 | tee blender-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E '^(FAILED|ERROR|E  )' blender-tests.log | head -40)
            exit "$status"
          fi
        env:
          PYTHONUNBUFFERED: "1"

  # ------------------------------------------------------------- windows smoke
  windows-smoke:
    name: Windows smoke test (source)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip; pip install -r requirements-dev.txt
      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest tests -q --ignore=tests/blender --tb=short 2>&1 | Tee-Object -FilePath tests.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content tests.log | Select-String -Pattern '^(FAILED|ERROR|E   )' | Select-Object -First 40 | ForEach-Object {
              Write-Host "::error::$($_.Line)"
            }
            exit 1
          }
      - name: Self test
        shell: pwsh
        run: |
          $out = python -m blenderbridge.app --selftest 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build add-on zip on Windows
        run: python tools/build_addon_zip.py
